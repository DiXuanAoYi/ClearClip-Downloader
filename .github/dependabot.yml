version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  # desktop/extension 没有 package.json（纯脚本，vendor 里的库是手工放进去的），不需要 npm 条目
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
