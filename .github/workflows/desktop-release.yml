name: desktop-release

# 推送 desktop-v* 标签（例如 desktop-v0.1.0）或手动运行时，构建三平台安装包和浏览器扩展，并发布 Release。
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：一个同时包含 Apple 芯片和 Intel 的通用安装包
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # Windows ARM64：只有 NSIS 安装包（WiX 不支持 ARM64）。标为实验性：失败不影响其他平台发布
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            arch: arm64
            target_dir: aarch64-pc-windows-msvc/release
            experimental: true
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || '') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      # 签名更新（可选）：配置 TAURI_SIGNING_PRIVATE_KEY（及密码）和对应的 TAURI_UPDATER_PUBKEY 后，
      # 生成更新包和 latest.json，程序内可直接下载安装；未配置时只生成普通安装包。
      - name: Updater signing
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$KEY" ]; then
            # 生成更新包时，Tauri 要求构建配置里有更新公钥（tauri.conf.json 里是空的），所以和 createUpdaterArtifacts 一起传进去。
            # 公钥文件内容是一行 base64，去掉可能带上的空白、换行再放进 JSON。
            pub=$(printf '%s' "$PUBKEY" | tr -d '[:space:]')
            if [ -z "$pub" ]; then
              echo "::error title=缺少更新公钥::配置了 TAURI_SIGNING_PRIVATE_KEY 却没有 TAURI_UPDATER_PUBKEY，无法生成更新包。请补上公钥（clearclip.key.pub 的全部内容），或删掉私钥 Secret 发一版不带自动更新的。"
              exit 1
            fi
            echo "args=--config {\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$pub\"}}}" >> "$GITHUB_OUTPUT"
          else
            echo 'args=' >> "$GITHUB_OUTPUT"
            echo "::warning title=没有生成更新包和 latest.json::仓库 Secrets 里没有 TAURI_SIGNING_PRIVATE_KEY，这次发布的版本不支持程序内一键更新（只能到发布页下载）。配置方法见 docs/release-guide/1-updater-key.md"
          fi
          if [ -z "$PUBKEY" ]; then
            echo "::warning title=没有编译进更新公钥::仓库 Secrets 里没有 TAURI_UPDATER_PUBKEY，程序无法验证更新包。配置方法见 docs/release-guide/1-updater-key.md"
          fi

      # 可选的签名配置：只导出已配置的 Secrets。变量以空值存在时，打包工具会尝试导入空证书并失败。
      - name: Export signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLEARCLIP_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          # 没有配置 Apple 开发者证书时，在 macOS 上做临时（ad-hoc）签名。
          # 完全没有签名的 .app 在 Apple 芯片上会被系统提示“已损坏，无法打开”；
          # 临时签名后提示变为“无法验证开发者”，可在“系统设置 → 隐私与安全性”中点“仍要打开”。
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            APPLE_SIGNING_IDENTITY="-"
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD CLEARCLIP_UPDATER_PUBKEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<__CLEARCLIP_EOF__"
                echo "$value"
                echo "__CLEARCLIP_EOF__"
              } >> "$GITHUB_ENV"
            fi
          done

      # 这一版的更新记录，放在 Release 页面最上面（取自 desktop/CHANGELOG.md，见 desktop/scripts/version.mjs --notes）
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          {
            echo 'body<<__CLEARCLIP_NOTES__'
            node desktop/scripts/version.mjs --notes "$version" || echo "（更新记录里没有 $version 这一版的内容）"
            echo '__CLEARCLIP_NOTES__'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 清影 ClearClip v__VERSION__
          releaseBody: |
            ## 这一版的更新

            ${{ steps.notes.outputs.body }}

            ---

            清影 ClearClip 桌面版，下载后直接安装使用，不需要编译环境。

            | 系统 | 下载哪个文件 |
            | --- | --- |
            | Windows 10 / 11 | `ClearClip_<版本>_x64-setup.exe`（安装版，推荐）或 `.msi`；免安装选 `ClearClip-<版本>-portable-windows-x64.zip` |
            | Windows 11 ARM（骁龙等 ARM 设备） | `ClearClip_<版本>_arm64-setup.exe`；免安装选 `ClearClip-<版本>-portable-windows-arm64.zip` |
            | macOS（Apple 芯片和 Intel 通用） | `ClearClip_<版本>_universal.dmg` |
            | Linux | `.AppImage`（赋予执行权限后直接运行）或 `.deb` |
            | 浏览器扩展（Chrome / Edge / Firefox） | `ClearClip-extension-<版本>.zip`，解压后按 [扩展说明](https://github.com/DiXuanAoYi/ClearClip-Downloader/tree/main/desktop/extension) 加载 |

            首次运行说明：
            - Windows：安装包未做代码签名，如出现“Windows 已保护你的电脑”，点“更多信息 → 仍要运行”。
            - macOS：安装包未经 Apple 公证。首次打开如果被拦截，到“系统设置 → 隐私与安全性”，在页面下方点“仍要打开”；如果提示“已损坏，无法打开”，在终端执行 `xattr -cr /Applications/ClearClip.app` 后再打开。
            - YouTube 等网站需要的 yt-dlp、ffmpeg 组件在“设置 → 组件”中一键安装，国内网络可填写 GitHub 镜像。

            以前各版本的改动见 [更新记录](https://github.com/DiXuanAoYi/ClearClip-Downloader/blob/main/desktop/CHANGELOG.md)。

            仅用于下载你有权保存的内容。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      # macOS：校验 .app 的签名完整（没有签名或签名损坏时系统会提示“已损坏”）
      - name: Verify macOS app signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app=$(find desktop/src-tauri/target -type d -name "ClearClip.app" -path "*bundle/macos*" | head -n 1)
          echo "app: $app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Identifier|Signature|Authority|flags" || true
          codesign --verify --deep --strict --verbose=2 "$app"
          archs=$(lipo -archs "$app/Contents/MacOS/clearclip")
          echo "archs: $archs"
          # 通用二进制必须同时包含两种架构
          echo "$archs" | grep -q arm64 && echo "$archs" | grep -q x86_64

      # Windows 便携版：免安装 zip，数据保存在程序目录的 data 文件夹（旁边放一个 portable 文件即启用）
      - name: Upload Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = "ClearClip-$version-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $targetDir = "${{ matrix.target_dir }}"
          if (-not $targetDir) { $targetDir = "release" }
          $arch = "${{ matrix.arch }}"
          if (-not $arch) { $arch = "x64" }
          Copy-Item "desktop/src-tauri/target/$targetDir/clearclip.exe" $dir/
          Set-Content -Path "$dir/portable" -Value "设置、数据和日志保存在本目录的 data 文件夹。删除此文件则改用系统应用数据目录。"
          Compress-Archive -Path $dir -DestinationPath "$dir-windows-$arch.zip" -Force
          gh release upload "desktop-v$version" "$dir-windows-$arch.zip" --clobber

      # 浏览器扩展：打包为 zip，可直接上传到扩展商店，或解压后以开发者模式加载
      - name: Upload browser extension zip
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 配了更新签名私钥时，latest.json 和 .sig 必须齐全；没配时它们本来就不会生成，只警告
          SIGNING_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          ext=$(jq -r .version desktop/extension/manifest.json)
          (cd desktop/extension && zip -r -X "$GITHUB_WORKSPACE/ClearClip-extension-$ext.zip" . -x README.md)
          gh release upload "desktop-v$version" "ClearClip-extension-$ext.zip" --clobber

  # 所有平台都构建完以后，核对 Release 里的安装包是否齐全（以前靠手工核对）。
  # Windows ARM64 是实验性的，缺了只警告；没有 latest.json 说明没配更新签名密钥，也只警告。
  verify:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          ext=$(jq -r .version desktop/extension/manifest.json)
          tag="desktop-v$version"
          if ! names=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); then
            echo "::error title=找不到 Release::$tag"
            exit 1
          fi
          {
            echo "## $tag 的安装包"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for f in "ClearClip_${version}_x64-setup.exe" "ClearClip_${version}_x64_en-US.msi" "ClearClip-${version}-portable-windows-x64.zip" \
                   "ClearClip_${version}_universal.dmg" "ClearClip_${version}_amd64.AppImage" "ClearClip_${version}_amd64.deb" \
                   "ClearClip-${version}-1.x86_64.rpm" "ClearClip-extension-${ext}.zip"; do
            if grep -qxF "$f" <<<"$names"; then
              echo "- ✅ $f" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $f" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Release 缺少安装包::$f"
              missing=1
            fi
          done
          for f in "ClearClip_${version}_arm64-setup.exe" "ClearClip-${version}-portable-windows-arm64.zip" "latest.json"; do
            if grep -qxF "$f" <<<"$names"; then
              echo "- ✅ $f" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⚠️ $f（可选）" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Release 里没有::$f（Windows ARM64 是实验性的；latest.json 要配好更新签名密钥才会有）"
            fi
          done
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            if ! grep -qxF "latest.json" <<<"$names"; then
              echo "::error title=缺少 latest.json::已配置更新签名私钥，Release 里却没有 latest.json，程序内更新会失效"
              missing=1
            fi
            if ! grep -q '\.sig$' <<<"$names"; then
              echo "::error title=缺少更新签名文件::已配置更新签名私钥，Release 里却没有任何 .sig 文件"
              missing=1
            fi
            # latest.json 里每个平台都要有非空的签名
            if grep -qxF "latest.json" <<<"$names"; then
              dir=$(mktemp -d)
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p latest.json -D "$dir"
              if ! jq -e '(.platforms | length) > 0 and ([.platforms[].signature] | all(type == "string" and length > 0))' "$dir/latest.json" >/dev/null; then
                echo "::error title=latest.json 不完整::没有平台条目，或有平台缺少 signature"
                missing=1
              fi
            fi
          fi
          exit $missing
