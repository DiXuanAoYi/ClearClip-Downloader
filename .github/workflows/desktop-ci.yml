name: desktop-ci

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-*.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-*.yml']
  # 手动运行：Actions → desktop-ci → Run workflow，可以选任意分支
  workflow_dispatch:

# 同一个分支有新提交时，取消还在跑的旧检查（main 上的不取消，每个合并都要有结果）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 下面两个任务的 if：本仓库分支开的 PR，推送时已经检查过同一个提交（PR 页面会显示那次的结果），
# PR 事件就不再重复跑一遍（显示为“已跳过”）；只有从别人 fork 来的 PR 才在 PR 事件里检查。
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # 版本号散在 7 个文件里，漏改一处发版时才会发现（scripts/version.mjs）
      - name: Version numbers are consistent
        run: npm run release:check

      - name: Frontend typecheck and build
        run: npm run build

      # 列出源码里还没有英文译文的中文（只提示，不会让检查失败；要强制可加 -- --strict）
      - name: Translation coverage
        run: npm run i18n

      # 剪辑界面的测试：工具函数单元测试 + Chromium 里用模拟后端跑界面（desktop/e2e，说明见 e2e/README.md）
      - name: Editor UI tests
        run: |
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
          npm test

      - name: Rust fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      # PDF 原处排版要加载 PDFium 动态库：下载官方预编译包，跑那条平时被忽略的集成测试（读块 → 写回译文 → 再读出来核对）
      - name: PDF layout integration test (PDFium)
        working-directory: desktop/src-tauri
        run: |
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/pdfium/p.tgz" https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz
          tar xzf "$RUNNER_TEMP/pdfium/p.tgz" -C "$RUNNER_TEMP/pdfium"
          CC_PDFIUM_LIB="$RUNNER_TEMP/pdfium/lib/libpdfium.so" CC_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            cargo test --lib pdfx::tests::pdfium_roundtrip -- --ignored --nocapture

  # 另外两个发布目标：macOS 通用二进制（两个架构）和 Windows ARM64。只做编译检查（不链接、不打包），
  # 提前发现这两个目标上才会出现的编译问题，免得打标签发布时才失败。
  cross-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # tauri::generate_context! 需要前端产物存在
      - run: npm run build

      - name: Cargo check (${{ matrix.target }})
        working-directory: desktop/src-tauri
        run: cargo check --locked --target ${{ matrix.target }}

