name: desktop-ci

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-*.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-*.yml']

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Frontend typecheck and build
        run: npm run build

      # 列出源码里还没有英文译文的中文（只提示，不会让检查失败；要强制可加 -- --strict）
      - name: Translation coverage
        run: npm run i18n

      # 剪辑界面的测试：工具函数单元测试 + Chromium 里用模拟后端跑界面（desktop/e2e，说明见 e2e/README.md）
      - name: Editor UI tests
        run: |
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
          npm test

      - name: Rust fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

  # 另外两个发布目标：macOS 通用二进制（两个架构）和 Windows ARM64。只做编译检查（不链接、不打包），
  # 提前发现这两个目标上才会出现的编译问题，免得打标签发布时才失败。
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # tauri::generate_context! 需要前端产物存在
      - run: npm run build

      - name: Cargo check (${{ matrix.target }})
        working-directory: desktop/src-tauri
        run: cargo check --locked --target ${{ matrix.target }}

