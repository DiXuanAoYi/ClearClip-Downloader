name: desktop-audit

# 每周查一次依赖里已公开的安全问题（npm 和 Rust）。不挡任何合并；发现问题时这个工作流会变红，GitHub 会通知仓库所有者。
on:
  schedule:
    - cron: '41 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit
        working-directory: desktop
        run: npm audit --audit-level=high
      # toolchain 由 desktop/src-tauri/rust-toolchain.toml 固定；targets 必须装到这个固定版本上
      # （装在 stable 上的 target，进 desktop/ 后 rustup 切到固定版本就看不到了），做法与 desktop-ci 一致。
      - name: Read pinned Rust version
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' desktop/src-tauri/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: cargo audit
        working-directory: desktop/src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
