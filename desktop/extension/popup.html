<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>发送到清影</title>
<style>
  body { width: 340px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f1d1a; background: #f6f4f1; }
  @media (prefers-color-scheme: dark) { body { background: #1b1a18; color: #ece8e2; } input { background: #26241f; color: inherit; border-color: #3a3630 !important; } }
  h1 { font-size: 15px; margin: 0 0 10px; } h1 b { color: #d9772f; }
  button { width: 100%; padding: 9px; margin-top: 8px; border: 0; border-radius: 8px; background: #d9772f; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.sec { background: transparent; color: inherit; border: 1px solid #d6d0c8; font-weight: 400; }
  label { display: block; margin-top: 8px; font-size: 12px; color: #7b756d; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d6d0c8; border-radius: 6px; font: inherit; }
  #msg { margin-top: 10px; font-size: 12px; min-height: 18px; word-break: break-all; }
  label.row { display: flex; gap: 6px; align-items: center; color: inherit; font-size: 12px; margin-top: 10px; }
  label.row input { width: auto; }
  #conn { margin-bottom: 8px; } #conn.ok::before { content: "● "; color: #2f8a57; } #conn.err::before { content: "● "; color: #c4423a; }
  #sites div { display: flex; justify-content: space-between; padding: 2px 0; } #sites a { color: #d9772f; cursor: pointer; }
  #sniffList .it { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid #d6d0c8; }
  #sniffList .it span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  #sniffList .it button { width: auto; margin: 0; padding: 3px 10px; font-size: 12px; }
  textarea { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d6d0c8; border-radius: 6px; font: inherit; resize: vertical; min-height: 54px; }
  @media (prefers-color-scheme: dark) { textarea { background: #26241f; color: inherit; border-color: #3a3630 !important; } }
  select { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d6d0c8; border-radius: 6px; font: inherit; background: transparent; color: inherit; }
  #sniffList .it input { width: auto; margin: 0; }
  #sniffList .it .sub { display: block; color: #7b756d; font-size: 11px; }
  #sniffBar { display: flex; gap: 6px; margin-top: 6px; } #sniffBar button { margin: 0; padding: 5px 8px; font-size: 12px; }
  #recent .it { display: flex; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid #d6d0c8; }
  #recent .it span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  #recent .it button { width: auto; margin: 0; padding: 3px 8px; font-size: 12px; }
  a.lnk { color: #d9772f; cursor: pointer; }
  .err { color: #c4423a; } .ok { color: #2f8a57; } .hidden { display: none; } .mute { color: #7b756d; font-size: 12px; }
</style>
</head>
<body>
  <h1>发送到<b>清影</b></h1>
  <div id="conn" class="mute"></div>
  <div id="main">
    <div id="page" class="mute"></div>
    <button id="send">发送当前页面</button>
    <button id="cookies" class="sec">同步此网站的登录 Cookie</button>
    <div id="syncInfo" class="mute"></div>
    <div id="sniffBox" class="hidden">
      <label>检测到的内容（<span id="sniffCount">0</span>）</label>
      <div id="sniffList"></div>
      <div id="sniffBar">
        <button id="sniffAll" class="sec">全选</button>
        <button id="sniffSend">发送所选</button>
      </div>
    </div>
    <label class="row"><input id="tkOn" type="checkbox" /> 接管浏览器下载（默认关闭）</label>
    <div id="tkInfo" class="mute"></div>
    <div id="recentBox" class="hidden">
      <label>最近接管的下载</label>
      <div id="recent"></div>
    </div>
    <label class="row"><input id="autoSite" type="checkbox" /> 登录状态变化时自动同步此网站</label>
    <button id="openTakeover" class="sec">接管下载设置</button>
    <button id="openSettings" class="sec">连接设置</button>
  </div>
  <div id="takeover" class="hidden">
    <p class="mute">开启后，浏览器要下载的文件会交给清影下载（带上登录状态和来源页）。按住 Alt 点击下载链接可以临时用浏览器下载。清影没有运行或没接住时，会自动交还给浏览器。</p>
    <label class="row"><input id="tkEnabled" type="checkbox" /> 接管浏览器下载</label>
    <label>接管范围</label>
    <select id="tkMode"><option value="types">只接管下面列出的文件类型</option><option value="all">所有下载（仍受大小和网站限制）</option></select>
    <label>文件类型（扩展名，用逗号或空格分隔）</label>
    <textarea id="tkTypes"></textarea>
    <a id="tkDefaultTypes" class="lnk">恢复默认类型</a>
    <label>最小文件大小（MB，已知大小小于它的不接管）</label>
    <input id="tkMin" type="number" min="0" step="1" />
    <label>只接管这些网站（每行一个，留空表示所有网站）</label>
    <textarea id="tkAllow" placeholder="example.com"></textarea>
    <label>不接管这些网站（每行一个，包含子域名）</label>
    <textarea id="tkDeny" placeholder="drive.google.com"></textarea>
    <label class="row"><input id="tkNotify" type="checkbox" /> 接管成功时弹出通知</label>
    <button id="tkSave">保存</button>
    <button id="tkBack" class="sec">返回</button>
  </div>
  <div id="settings" class="hidden">
    <p id="setupHint" class="mute hidden"><b>还差一步：</b>填好下面的端口和访问令牌，右键菜单和发送按钮才能使用。</p>
    <p class="mute">打开电脑上的清影，进入“设置 → 手机与浏览器扩展”，开启服务，把“分享菜单”里的端口和访问令牌复制到这里，再点“保存并测试”。</p>
    <label>端口</label><input id="port" type="number" placeholder="例如 42031" />
    <label>访问令牌（X-Token）</label><input id="token" type="password" />
    <label class="row"><input id="autoSync" type="checkbox" /> 开启自动同步</label>
    <p class="mute">开启后，下面列出的网站登录状态变化时（重新登录、Cookie 更新），扩展会自动把这个网站的 Cookie 同步给清影，每个网站最多 5 分钟一次。只同步列表里的网站。</p>
    <div id="sites" class="mute"></div>
    <button id="save">保存并测试</button>
    <button id="back" class="sec">返回</button>
  </div>
  <div id="msg"></div>
  <script src="shared.js"></script>
  <script src="takeover.js"></script>
  <script src="sniff.js"></script>
  <script src="popup.js"></script>
</body>
</html>
