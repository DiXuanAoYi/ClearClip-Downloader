<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面媒体总览</title>
<link rel="stylesheet" href="popup.css" />
<link rel="stylesheet" href="overview.css" />
</head>
<body class="ov">
  <header>
    <span class="logo" aria-hidden="true"></span>
    <b>页面媒体总览</b>
    <span id="pageInfo" class="mute"></span>
  </header>

  <div id="streams" class="hidden">
    <label>检测到的视频流 / 文件（播放页里请求到的，可直接发送）</label>
    <div id="streamList"></div>
    <button id="streamAll" class="small">全部发送</button>
  </div>

  <div id="bar">
    <div id="kinds" role="tablist"></div>
    <label class="inline">最小边长
      <select id="minSize">
        <option value="0">不限</option>
        <option value="100">≥ 100 px</option>
        <option value="300" selected>≥ 300 px</option>
        <option value="600">≥ 600 px</option>
      </select>
    </label>
    <button id="selAll" class="sec small">全选当前</button>
    <button id="selNone" class="sec small">清除</button>
    <span class="grow"></span>
    <button id="copyUrls" class="sec small">复制地址</button>
    <button id="searchOne" class="sec small" title="选中一张图片，用所有搜索引擎各查一次">以图搜图（全部引擎）</button>
    <button id="sendSel" class="small">发送所选</button>
    <button id="rescan" class="sec small">重新扫描</button>
    <button id="pickOnPage" class="sec small" title="回到网页，直接点图片、视频、链接来勾选，勾完一起发送">在页面上点选…</button>
    <button id="pageLinks" class="sec small" title="收集本页所有视频链接，在清影里打开批量添加面板">本页所有视频链接 → 清影</button>
  </div>
  <div id="nameBar">
    <label class="inline">命名
      <select id="nameMode">
        <option value="orig">保持原名</option>
        <option value="tpl">自定义模板</option>
        <option value="ai">AI 总结命名</option>
      </select>
    </label>
    <span id="tplBox" class="hidden">
      <input id="tpl" type="text" spellcheck="false" maxlength="80" placeholder="{序号}-{标题}" aria-label="命名模板" />
      <span class="chips" id="tplChips"></span>
    </span>
    <button id="aiName" class="sec small hidden" title="让清影里的大模型根据图片说明、链接文字起名；选中的项才会起名，可以再手动改">AI 起名（所选）</button>
    <span id="nameHint" class="mute"></span>
  </div>
  <div id="msg"></div>
  <div id="grid"></div>
  <div id="empty" class="mute hidden">这个页面里没有找到符合条件的内容。试试把“最小边长”调小。</div>

  <div id="viewer" class="hidden" role="dialog" aria-label="查看原图">
    <div id="vTop"><b id="vName"></b><span id="vPos" class="mute"></span><span id="vInfo" class="mute"></span><span id="vFmt" class="fmt" hidden></span><span class="grow"></span><span id="vMsg" class="mute"></span><button id="vClose" class="sec small" aria-label="关闭">✕</button></div>
    <div id="vBody"><button id="vPrev" class="nav" aria-label="上一张">‹</button><div id="vStage"></div><button id="vNext" class="nav" aria-label="下一张">›</button></div>
    <div id="vBar"><button id="vScale" class="sec small">适应 / 100%</button><button id="vCopyImg" class="sec small">复制图片</button><button id="vCopyUrl" class="sec small">复制地址</button><span class="grow"></span><button id="vSave" class="small">保存原图</button><span class="mute keys">← → 切换　空格 适应/100%　S 保存　Esc 关闭</span></div>
  </div>

  <script src="shared.js"></script>
  <script src="takeover.js"></script>
  <script src="sniff.js"></script>
  <script src="media-sniff.js"></script>
  <script src="naming.js"></script>
  <script src="engines.js"></script>
  <script src="overview.js"></script>
</body>
</html>
