# cargo deny 配置（CI 的 deny 任务跑 `cargo deny check`）：许可证、依赖来源、已公开的安全通告。
# 没列在这里的问题一律算新问题、让检查变红；例外都要写理由，上游修好后删掉。

[graph]
# 只检查实际会进安装包的目标（和 desktop-release 一致）
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# “不再维护”的通告只检查我们直接依赖的库：上面列的传递依赖（paste、zbus 系等）来自 tauri / librqbit 等上游，
# 我们没法自己换，每周的 cargo audit 也只把它们当警告。真正的漏洞（vulnerability）和 unsound 仍然一律拦截。
unmaintained = "workspace"
yanked = "warn"
# 例外与 .cargo/audit.toml（每周 cargo audit）保持同步
ignore = [
  # ringbuf 0.4.8 的双重释放：只在元素的 Drop 里 panic 时才触发；依赖它的是 BT 下载库 librqbit-utp，元素是普通字节。
  "RUSTSEC-2026-0293",
  # rsa 的 Marvin 时序侧信道：来自 SFTP 用的 russh，需要精确测量本机计时；上游还没有修复版本。
  "RUSTSEC-2023-0071",
  # tract-nnef 解析 NNEF 张量时整数溢出：清影只加载 ONNX 模型，不会解析 NNEF 文件。
  "RUSTSEC-2026-0217",
  # zip 4.6.1 的 4 条（都是 `ZipArchive::extract`）：只来自 tauri-plugin-updater，解压的是已验签的更新包。
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
]

[licenses]
# 都是宽松许可证；MPL-2.0 是文件级弱 copyleft（只要不改它的源文件就没有额外义务）。
# 出现 GPL / AGPL / LGPL 等新许可证时检查会变红，需要人工判断后再加。
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
  "BlueOak-1.0.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0",
  "Unlicense", "Zlib", "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
# 同一个库的多个版本很常见（tauri 生态），只提示不拦
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
