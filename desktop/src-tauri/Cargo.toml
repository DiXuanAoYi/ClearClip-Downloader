[package]
name = "clearclip"
version = "0.9.0"
description = "清影 ClearClip：抖音 / 快手短视频解析与下载桌面程序"
authors = ["ClearClip contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "clearclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "gzip", "deflate", "system-proxy", "socks"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt-multi-thread", "process", "net"] }
futures-util = "0.3"
async-trait = "0.1"
regex = "1"
url = "2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-log = "2"
log = "0.4"
aes-gcm = { version = "0.10", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
fs4 = { version = "0.13", features = ["sync"] }
if-addrs = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
tar = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
encoding_rs = "0.8"
base64 = "0.22"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
# BT / 磁力：librqbit 自带 DHT、PEX、UPnP。TLS 提供者（给 https tracker 和种子链接用）由我们安装 ring，避免引入 aws-lc。
librqbit = { version = "9.0.1", default-features = false }
bt-http = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tract-onnx = "0.21"
rustfft = "6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
librqbit-core = { version = "9.0.1", default-features = true }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 开发版里密码哈希太慢，对这两个库单独开优化
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
prost = "0.11"
