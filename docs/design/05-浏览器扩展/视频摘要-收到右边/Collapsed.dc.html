<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>视频摘要 · 收起</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.pill{width:30px;height:30px;border-radius:50%;background:#e0e4e1}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #f3f4f3; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1d2420; font-size: 13px; line-height: 1.55">

  <div style="height: 52px; background: #fff; border-bottom: 1px solid #e3e6e3; display: flex; align-items: center; gap: 16px; padding: 0 24px">
    <b style="font-size: 16px; color: #1d2420">示例视频站</b>
    <span style="flex: 1; max-width: 420px; height: 32px; border-radius: 16px; background: #eceeed; display: flex; align-items: center; padding: 0 14px; color: #8a948f">搜索</span>
    <span style="flex: 1"></span>
    <span class="pill"></span><span class="pill"></span>
  </div>
  <div style="padding: 20px 24px; display: flex; gap: 20px">
    <div style="width: 820px; display: flex; flex-direction: column; gap: 10px">
      <div style="position: relative; width: 820px; height: 461px; border-radius: 10px; background: linear-gradient(135deg, #1b2421, #0e1311); overflow: hidden">
        <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(transparent, rgba(0,0,0,.55)); display: flex; align-items: flex-end; padding: 0 14px 10px; color: #fff; font-size: 12px; gap: 10px"><span>4:21 / 10:12</span><span style="flex: 1; height: 3px; background: rgba(255,255,255,.3); border-radius: 2px; margin-bottom: 6px"><i style="display: block; width: 42%; height: 3px; background: #d9762b; border-radius: 2px"></i></span></div>
      </div>
      <b style="font-size: 18px">电动车电池，十分钟讲清楚</b>
      <span style="color: #66716c">12.4 万次观看 · 3 天前</span>
      <div style="height: 10px; width: 640px; background: #e0e4e1; border-radius: 5px"></div>
      <div style="height: 10px; width: 540px; background: #e0e4e1; border-radius: 5px"></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; gap: 10px"><div style="width: 150px; height: 84px; border-radius: 8px; background: #d5dad6"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px"><i style="height: 9px; background: #e0e4e1; border-radius: 4px"></i><i style="height: 9px; width: 70%; background: #e0e4e1; border-radius: 4px"></i></div></div>
      <div style="display: flex; gap: 10px"><div style="width: 150px; height: 84px; border-radius: 8px; background: #d5dad6"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px"><i style="height: 9px; background: #e0e4e1; border-radius: 4px"></i><i style="height: 9px; width: 70%; background: #e0e4e1; border-radius: 4px"></i></div></div>
      <div style="display: flex; gap: 10px"><div style="width: 150px; height: 84px; border-radius: 8px; background: #d5dad6"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px"><i style="height: 9px; background: #e0e4e1; border-radius: 4px"></i><i style="height: 9px; width: 70%; background: #e0e4e1; border-radius: 4px"></i></div></div>
    </div>
  </div>

  <!-- 小标签：贴右边缘，宽 30 高 84，平时半透明，位置可以上下拖 -->
  <button aria-label="展开视频摘要" title="视频摘要（Alt+Shift+S）" style="position: absolute; right: 0; top: 274px; width: 30px; height: 84px; padding: 0; box-sizing: border-box; border: 1px solid #cfd5d1; border-right: 0; border-radius: 12px 0 0 12px; background: #fbfaf8; box-shadow: -3px 2px 10px rgba(0,0,0,.14); opacity: .78; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px">
    <span style="width: 20px; height: 20px; border-radius: 6px; background: #d9762b; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center">摘</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5d6862" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    <span style="display: flex; flex-direction: column; gap: 2px"><i style="width: 10px; height: 2px; border-radius: 1px; background: #b7beb9"></i><i style="width: 10px; height: 2px; border-radius: 1px; background: #b7beb9"></i></span>
  </button>

  <!-- 说明 -->
  <div style="position: absolute; left: 24px; bottom: 24px; width: 420px; background: #fff; border: 1px solid #d9dedb; border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 16px #0002; display: flex; flex-direction: column; gap: 7px">
    <b>收起后</b>
    <span>· 页面完整可用：不挤开页面，也不挡内容，只有右边缘 30 像素宽的一条。</span>
    <span>· 平时半透明（78%），鼠标过去变清楚；标签中间是“摘”，下面两道线表示<b>可以上下拖</b>换位置，所有网站共用这个位置。</span>
    <span>· 点一下展开；停在上面 0.35 秒是预览（看下一张图）。</span>
  </div>
  <div style="position: absolute; right: 52px; top: 296px; display: flex; align-items: center; gap: 6px; color: #b4561a; font-weight: 600"><span>小标签</span><svg width="28" height="14" viewBox="0 0 28 14" fill="none" stroke="#b4561a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h24M20 2l5 5-5 5"></path></svg></div>
</div>
</x-dc>
