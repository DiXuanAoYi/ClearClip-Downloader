<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机端 首次配对</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.act{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid #ebe5dc}
.ai{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#f6f4f1;color:#2a2622;display:flex;flex-direction:column;overflow:hidden;position:relative">

<div style="padding:54px 18px 12px;display:flex;align-items:center;gap:10px;background:#fbfaf8;border-bottom:1px solid #e9e3da">
<div style="width:34px;height:34px;border-radius:10px;background:#d9772f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">清</div>
<div style="flex-grow:1"><div style="font-size:16px;font-weight:700">隔空传送</div>
<div style="font-size:12px;color:#a0662f;display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:#d9772f"></span>等待电脑确认…</div></div>
</div>

<div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 36px;text-align:center">
<div style="position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center">
<div style="position:absolute;inset:0;border-radius:50%;border:2px solid #f0d6bc"></div>
<div style="position:absolute;inset:18px;border-radius:50%;border:2px solid #e8bf98"></div>
<div style="position:absolute;inset:36px;border-radius:50%;background:#d9772f;color:#fff;display:flex;align-items:center;justify-content:center">
<svg class="ic" viewBox="0 0 24 24" style="width:34px;height:34px"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
</div>
</div>
<div style="font-size:19px;font-weight:700">请在电脑上点“允许”</div>
<div style="font-size:14px;line-height:1.6;color:#6e675f">第一次使用需要配对。电脑上会弹出请求，确认设备名一致后允许，这里会自动继续。</div>
<div style="background:#fff;border:1px solid #ebe5dc;border-radius:14px;padding:10px 18px;display:flex;flex-direction:column;gap:2px">
<span style="font-size:11.5px;color:#8a8279">请核对电脑上显示的验证码</span>
<span style="font-size:30px;font-weight:800;letter-spacing:8px;color:#d9772f">472 913</span>
</div>
</div>

<!-- 底部选择面板（演示：点“+”后） -->
<div style="margin:0 12px 24px;padding:16px;border-radius:24px;background:#fbfaf8;border:1px solid #e9e3da;box-shadow:0 -6px 30px #0000001a;display:flex;flex-direction:column;gap:10px">
<div style="align-self:center;width:38px;height:4px;border-radius:2px;background:#d8d1c7"></div>
<div style="font-size:13px;color:#8a8279;text-align:center">选好内容后会逐个发送；配对完成前先放在这里</div>
<div class="act"><div class="ai" style="background:#c98a3b"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 9"/></svg></div><div style="flex-grow:1"><div style="font-size:15px;font-weight:700">照片和视频</div><div style="font-size:12px;color:#8a8279">从相册选择，可多选</div></div></div>
<div class="act"><div class="ai" style="background:#4b7bb5"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></div><div style="flex-grow:1"><div style="font-size:15px;font-weight:700">文件</div><div style="font-size:12px;color:#8a8279">文档、压缩包、任何格式</div></div></div>
<div class="act"><div class="ai" style="background:#7a62b5"><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg></div><div style="flex-grow:1"><div style="font-size:15px;font-weight:700">粘贴剪贴板里的链接</div><div style="font-size:12px;color:#8a8279">电脑会直接开始下载</div></div></div>
</div>
</div>
</x-dc>

</html>
