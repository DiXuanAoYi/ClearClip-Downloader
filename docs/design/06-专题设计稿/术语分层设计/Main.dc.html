<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>编辑术语库 · 分层术语</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg2);min-width:0}
.in{height:34px;box-sizing:border-box;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);font:inherit;font-size:13px;color:var(--fg);outline:none;width:100%}
.sel{display:flex;align-items:center;justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);font:inherit;font-size:12.5px;color:var(--fg);cursor:pointer;white-space:nowrap}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--mute);cursor:pointer}
.cell{height:30px;box-sizing:border-box;padding:0 8px;border:1px solid transparent;border-radius:5px;background:transparent;font:inherit;font-size:13px;color:var(--fg);outline:none;width:100%;min-width:0}
.kbd{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--line);border-radius:4px;background:var(--fill);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fg2)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--fill);color:var(--fg2);font-size:11px;white-space:nowrap}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 1280px; height: 900px; overflow: hidden; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; line-height: 1.5; color: var(--fg); background: var(--page)">

  <!-- 背后的设置页（压暗） -->
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 32px 40px; display: flex; flex-direction: column; gap: 14px; opacity: .55">
    <div style="font-size: 15px; font-weight: 600">AI 术语库</div>
    <div style="height: 14px; width: 60%; border-radius: 4px; background: var(--line)"></div>
    <div style="height: 14px; width: 45%; border-radius: 4px; background: var(--line)"></div>
    <div style="height: 220px; border-radius: 10px; background: var(--card); border: 1px solid var(--line)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <!-- 对话框 -->
  <section role="dialog" aria-label="编辑术语库" style="position: absolute; left: 160px; top: 36px; width: 960px; height: 828px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px #00000040; overflow: hidden">

    <!-- 标题 -->
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 14px">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <h1 style="margin: 0; font-size: 17px; font-weight: 600">编辑术语库</h1>
        <span style="font-size: 12px; color: var(--mute)">软件界面 / 清影</span>
      </div>
      <button type="button" class="ib" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </header>

    <!-- 基本信息：一行四格 -->
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0 24px 16px">
      <label class="lbl">名称<input class="in" value="清影界面"></label>
      <label class="lbl">适用的目标语言<span class="in sel"><span>English</span><span style="color: var(--mute)">▾</span></span></label>
      <label class="lbl">文件夹<span class="in sel"><span>软件界面</span><span style="color: var(--mute)">▾</span></span></label>
      <label class="lbl">只在这些网站 / 软件生效<span class="in sel"><span style="color: var(--mute)">全部（留空）</span><span style="color: var(--mute)">▾</span></span></label>
    </div>

    <!-- 术语工具条 -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); background: var(--foot)">
      <label style="display: flex; align-items: center; gap: 8px; width: 220px; height: 32px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--card)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--mute)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input placeholder="搜索原文、译文、说明" aria-label="搜索术语" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 12.5px; color: var(--fg)">
      </label>
      <button type="button" class="btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>添加术语</button>
      <button type="button" class="btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v9a3 3 0 0 0 3 3h9"></path><path d="M15 13l3 3-3 3"></path></svg>添加下级</button>
      <span style="width: 1px; height: 20px; background: var(--line); margin: 0 4px"></span>
      <button type="button" class="btn">全部展开</button>
      <button type="button" class="btn">全部收起</button>
      <button type="button" class="btn">并入 CSV…</button>
      <span style="margin-left: auto; font-size: 12px; color: var(--mute)">共 <span class="mono">19</span> 条 · <span class="mono">3</span> 层</span>
    </div>

    <!-- 表头 -->
    <div style="display: grid; grid-template-columns: 24px minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, .8fr) 76px; gap: 8px; align-items: center; height: 34px; padding: 0 24px 0 12px; font-size: 12px; color: var(--mute); border-bottom: 1px solid var(--line-soft)">
      <span></span><span>原文</span><span>译文</span><span>说明（给模型的提示）</span><span></span>
    </div>

    <!-- 树形术语 -->
    <div role="tree" aria-label="术语" style="flex: 1; min-height: 0; overflow: hidden; padding: 6px 12px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
        <div role="treeitem" aria-level="{{ r.aria }}" aria-expanded="{{ r.expanded }}" style="{{ r.rowStyle }}">
          <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; color: var(--dot); cursor: grab; visibility: {{ r.gripVis }}">
            <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.3"></circle><circle cx="7.5" cy="2.5" r="1.3"></circle><circle cx="2.5" cy="7" r="1.3"></circle><circle cx="7.5" cy="7" r="1.3"></circle><circle cx="2.5" cy="11.5" r="1.3"></circle><circle cx="7.5" cy="11.5" r="1.3"></circle></g></svg>
          </span>
          <div style="display: flex; align-items: center; min-width: 0; height: 100%">
            <sc-for list="{{ r.guides }}" as="g" hint-placeholder-count="1">
              <span aria-hidden="true" style="flex: none; width: 20px; align-self: stretch; margin-left: 9px; border-left: 1px solid var(--guide); box-sizing: border-box"></span>
            </sc-for>
            <button type="button" class="ib" aria-label="{{ r.caretLabel }}" style="flex: none; width: 22px; height: 22px; visibility: {{ r.caretVis }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ r.caretRot }}deg)"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <input class="cell" value="{{ r.source }}" aria-label="原文" style="{{ r.srcStyle }}">
            <span class="tag" style="display: {{ r.countShow }}; margin-left: 4px">{{ r.count }}</span>
          </div>
          <input class="cell" value="{{ r.target }}" aria-label="译文" style="{{ r.cellStyle }}">
          <input class="cell" value="{{ r.note }}" placeholder="" aria-label="说明" style="{{ r.noteStyle }}">
          <div style="display: flex; justify-content: flex-end; gap: 2px; visibility: {{ r.actVis }}">
            <button type="button" class="ib" aria-label="添加下级" title="添加下级（Tab）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v9a3 3 0 0 0 3 3h9"></path><path d="M15 13l3 3-3 3"></path></svg></button>
            <button type="button" class="ib" aria-label="更多操作" title="更多操作"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></g></svg></button>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- 底栏：当前路径 + 快捷键 + 保存 -->
    <footer style="display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-top: 1px solid var(--line); background: var(--foot)">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; overflow: hidden">
          <span style="color: var(--mute); font-size: 12px">当前</span>
          <span>界面</span><span style="color: var(--mute)">›</span><span>文件</span><span style="color: var(--mute)">›</span><b style="font-weight: 600">打开文件</b>
          <span style="color: var(--mute); margin: 0 4px">=</span>
          <span class="mono" style="color: var(--acc-text)">Interface › File › Open File</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 11.5px; color: var(--mute)">
          <span style="display: inline-flex; align-items: center; gap: 4px">层级底色 <span style="width: 14px; height: 10px; border-radius: 3px; background: var(--lv0); box-shadow: inset 0 0 0 1px var(--lvline0)"></span>1 <span style="width: 14px; height: 10px; border-radius: 3px; background: var(--lv1); box-shadow: inset 0 0 0 1px var(--lvline1)"></span>2 <span style="width: 14px; height: 10px; border-radius: 3px; background: var(--lv2); box-shadow: inset 0 0 0 1px var(--lvline2)"></span>3+</span>
          <span><span class="kbd">Enter</span> 加同级</span>
          <span><span class="kbd">Tab</span> 变成下级</span>
          <span><span class="kbd">Shift+Tab</span> 升一层</span>
          <span><span class="kbd">Alt+↑↓</span> 上下移动</span>
          <span><span class="kbd">←→</span> 收起 / 展开</span>
        </div>
      </div>
      <button type="button" class="btn" style="height: 36px; padding: 0 16px">取消</button>
      <button type="button" style="height: 36px; padding: 0 20px; border: 0; border-radius: 6px; background: var(--acc-strong); color: var(--on-acc); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">保存</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { page: '#14181a', card: '#22292c', line: '#2f383c', 'line-soft': '#283034', fill: '#1b2023', hover: '#262e31', foot: '#1e2427', fg: '#e7ecea', fg2: '#b4bfbb', mute: '#8c9894', dot: '#5a6569', guide: '#3a4448', acc: '#f08a3c', 'acc-strong': '#f08a3c', 'acc-soft': '#3a2b20', 'acc-line': '#8a5027', 'acc-text': '#f3a163', 'on-acc': '#1d2420', scrim: '#00000080', lv0: '#323b3f', lv1: '#2a3235', lv2: '#252c2f', lvline0: '#3d474b', lvline1: '#333c40', lvline2: '#2c3437' }
      : { page: '#f4f5f4', card: '#ffffff', line: '#d9dedb', 'line-soft': '#e3e7e4', fill: '#eef0ee', hover: '#f6f7f6', foot: '#fafbfa', fg: '#1d2420', fg2: '#4a5550', mute: '#69746f', dot: '#b9c1bd', guide: '#d3d9d5', acc: '#d9762b', 'acc-strong': '#b4561a', 'acc-soft': '#fbf1ea', 'acc-line': '#ecbb95', 'acc-text': '#8a4a19', 'on-acc': '#ffffff', scrim: '#1d242059', lv0: '#e6eae7', lv1: '#eff2f0', lv2: '#f8f9f8', lvline0: '#d7ddd9', lvline1: '#e1e6e2', lvline2: '#eaeeeb' };
    const vars = Object.entries(t).map(([k, v]) => `--${k}: ${v};`).join(' ');
    const data = [
      [0, '界面', 'Interface', '软件界面的菜单和按钮', 'open', 3],
      [1, '文件', 'File', '菜单名', 'open', 2],
      [2, '打开文件', 'Open File', '', 'leaf', 0, true],
      [2, '退出', 'Exit', '', 'leaf', 0],
      [1, '编辑', 'Edit', '菜单名', 'open', 2],
      [2, '重做', 'Redo', '', 'leaf', 0],
      [2, '复制', 'Copy', '', 'leaf', 0],
      [1, '帮助', 'Help', '菜单名', 'closed', 3],
      [0, '角色', 'Characters', '游戏里的人名，保持一致', 'closed', 6],
      [0, '旅行者', 'Traveler', '主角称呼', 'leaf', 0],
      [0, '原石', 'Primogem', '', 'leaf', 0],
    ];
    const rows = data.map(([level, source, target, note, state, count, active]) => {
      // 每一层一种底色：第一层最深，越往下越浅；当前行用浅橙盖过去
      const lv = Math.min(level, 2);
      const bg = active ? 'background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc-line);' : `background: var(--lv${lv}); box-shadow: inset 0 0 0 1px var(--lvline${lv});`;
      const strong = level === 0 && state !== 'leaf' ? 'font-weight: 600;' : '';
      const editing = active ? 'background: var(--card); border-color: var(--acc);' : '';
      return {
        aria: String(level + 1),
        expanded: state === 'leaf' ? undefined : String(state === 'open'),
        rowStyle: `display: grid; grid-template-columns: 24px minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, .8fr) 76px; gap: 8px; align-items: center; height: 38px; margin-bottom: 3px; padding: 0 12px 0 0; border-radius: 6px; ${bg}`,
        guides: Array.from({ length: level }, (_, i) => ({ i })),
        caretVis: state === 'leaf' ? 'hidden' : 'visible',
        caretRot: state === 'open' ? 90 : 0,
        caretLabel: state === 'open' ? '收起' : '展开',
        gripVis: active ? 'visible' : 'hidden',
        source, target, note,
        srcStyle: `${strong} ${editing}`,
        cellStyle: `${strong}`,
        noteStyle: 'color: var(--mute); font-size: 12.5px;',
        countShow: state === 'closed' ? 'inline-flex' : 'none',
        count: `${count} 条下级`,
        actVis: active ? 'visible' : 'hidden',
      };
    });
    return { vars, rows };
  }
}
</script>
</body>
</html>
