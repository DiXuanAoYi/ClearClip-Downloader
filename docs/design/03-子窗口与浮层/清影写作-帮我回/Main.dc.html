<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>帮我回 · 亮色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.chip{border:1px solid #e1e5e2;background:#fff;color:#1d2420;border-radius:999px;padding:0 12px;height:30px;font-size:12.5px;white-space:nowrap}
.chip.on{border-color:#d9762b;background:#fbeadb;color:#8a3d0f;font-weight:600}
.lbl{font-size:12px;color:#66716c;font-weight:500}
.tab{flex:1;border:0;background:none;color:#66716c;border-radius:7px;height:30px;font-size:13px}
.tab.on{background:#fff;color:#8a3d0f;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.ver{border:1px solid #e1e5e2;background:#fff;border-radius:8px;height:28px;padding:0 10px;font-size:12px;color:#66716c}
.ver.on{border-color:#d9762b;color:#8a3d0f;background:#fbeadb;font-weight:600}
.tw{border:1px dashed #cfd5d1;background:none;border-radius:999px;height:26px;padding:0 10px;font-size:12px;color:#4d5853}
.ghost{border:1px solid #e1e5e2;background:#fff;border-radius:8px;height:32px;padding:0 12px;font-size:13px;color:#1d2420}
</style>
</helmet>
<div style="width: 440px; height: 1000px; box-sizing: border-box; padding: 10px; background: #e9ecea; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1d2420; font-size: 13px; line-height: 1.55">
<div style="height: 100%; display: flex; flex-direction: column; background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(20,30,25,.22), 0 1px 3px rgba(20,30,25,.18); overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; background: #f5f6f5; border-bottom: 1px solid #e1e5e2">
    <span style="width: 24px; height: 24px; border-radius: 8px; background: #c8661f; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700">写</span>
    <b style="font-size: 14px">清影写作</b>
    <span style="font-size: 11px; line-height: 20px; padding: 0 9px; border-radius: 999px; background: #fff; border: 1px solid #e1e5e2; color: #66716c">微信 · 王经理</span>
    <span style="flex: 1"></span>
    <button aria-label="固定在最前" style="border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; color: #d9762b; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v2h-5v5l-1 1-1-1v-5H5v-2l3-3z"></path></svg></button>
    <button aria-label="关闭" style="border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; color: #66716c; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 12px">
    <nav style="display: flex; gap: 2px; background: #f5f6f5; border: 1px solid #e1e5e2; border-radius: 10px; padding: 3px">
      <button class="tab on">帮我回</button>
      <button class="tab">改写润色</button>
      <button class="tab">检查</button>
      <button class="tab">翻译 · 更多</button>
    </nav>

    <section style="border: 1px solid #e1e5e2; background: #f5f6f5; border-radius: 10px; padding: 9px 11px 8px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 6px"><span class="lbl">收到的消息</span><span style="flex: 1"></span><button style="border: 0; background: none; font-size: 12px; color: #66716c">＋ 贴上前面的聊天</button></div>
      <p style="margin: 0">小李，这周六公司有客户来访，需要人手帮忙接待，你方便过来加个班吗？大概上午 9 点到下午 3 点。</p>
      <div style="display: flex; gap: 6px; align-items: flex-start; border-top: 1px dashed #d6dbd8; padding-top: 7px; font-size: 12px; color: #4d5853">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c8661f" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 3px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
        <span>看懂了：<b style="color: #1d2420; font-weight: 600">请你周六加班</b>，时间已给出（9:00–15:00），语气客气、有点急。</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 7px">
      <span class="lbl">对方是</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button class="chip on">上级</button><button class="chip">同事</button><button class="chip">客户</button><button class="chip">朋友</button><button class="chip">家人</button><button class="chip">不太熟</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 7px">
      <span class="lbl">我的意思</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button class="chip">答应</button><button class="chip on">有条件地答应</button><button class="chip">再想想</button><button class="chip">问清楚</button><button class="chip">拒绝</button>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; border: 1px solid #d9762b; border-radius: 8px; padding: 0 10px; height: 36px; background: #fff; box-shadow: 0 0 0 3px rgba(217,118,43,.15)">
        <span style="font-size: 12px; color: #8a3d0f; font-weight: 600; white-space: nowrap">条件</span>
        <input value="下周一调休一天" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; color: #1d2420; background: none">
      </label>
    </section>

    <section style="display: flex; flex-direction: column; gap: 7px">
      <span class="lbl">怎么说</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button class="chip">正式得体</button><button class="chip on">高情商</button><button class="chip">幽默接话</button><button class="chip">简短干脆</button><button class="chip">温暖真诚</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #66716c">
        <span>长度</span>
        <span style="display: inline-flex; border: 1px solid #e1e5e2; border-radius: 8px; overflow: hidden">
          <button style="border: 0; background: #fff; height: 26px; padding: 0 10px; font-size: 12px; color: #66716c">一句话</button>
          <button style="border: 0; border-left: 1px solid #e1e5e2; background: #fbeadb; height: 26px; padding: 0 10px; font-size: 12px; color: #8a3d0f; font-weight: 600">正常</button>
          <button style="border: 0; border-left: 1px solid #e1e5e2; background: #fff; height: 26px; padding: 0 10px; font-size: 12px; color: #66716c">详细</button>
        </span>
        <span style="flex: 1"></span>
        <span>还想说：</span><span style="color: #1d2420">9 点准时到</span>
      </div>
    </section>

    <button style="height: 40px; border: 0; border-radius: 10px; background: #b4561a; color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">生成回复 <kbd style="font: 11px/1 inherit; border: 1px solid rgba(255,255,255,.5); border-radius: 4px; padding: 2px 5px; font-weight: 400">Ctrl ↵</kbd></button>

    <section style="border-top: 1px solid #e1e5e2; padding-top: 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 6px">
        <b>回复</b>
        <button class="ver on">稳妥</button><button class="ver">热情</button><button class="ver">简短</button>
        <span style="flex: 1"></span><span style="font-size: 12px; color: #66716c">42 字</span>
      </div>
      <div style="border: 1px solid #e1e5e2; border-radius: 10px; padding: 10px 12px; background: #fff; font-size: 13.5px; line-height: 1.7">王经理好，周六我可以过来帮忙接待，9 点准时到。想跟您申请一下：下周一调休一天，您看可以吗？</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
        <span style="font-size: 12px; color: #66716c">微调</span>
        <button class="tw">更软一点</button><button class="tw">更硬一点</button><button class="tw">再短点</button><button class="tw">去掉客套</button><button class="tw">加个表情</button>
      </div>
      <div style="display: flex; gap: 6px; align-items: center">
        <button style="height: 32px; border: 0; border-radius: 8px; background: #b4561a; color: #fff; padding: 0 16px; font-size: 13px; font-weight: 600">替换到微信</button>
        <button class="ghost">复制</button>
        <button class="ghost">再来一版</button>
        <span style="flex: 1"></span>
        <button aria-label="收藏这个回复" class="ghost" style="padding: 0 9px">☆</button>
      </div>
      <small style="color: #66716c; font-size: 11.5px">只用你给的条件和时间，不替你编理由、不多承诺。</small>
    </section>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
