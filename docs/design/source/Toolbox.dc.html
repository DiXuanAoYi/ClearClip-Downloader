<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清影 · 工具箱</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="clearclip.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
body { margin: 0; }
.shell{min-height:1080px}

</style>
</helmet>
<div class="cc" data-theme="{{theme}}">
<div class="shell">
<nav class="rail" aria-label="主导航">
<div class="logo" role="img" aria-label="清影"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3l3.5 6.1M20.2 8.2l-6.8 1M20.2 15.8 15 11M12 21l-3.5-6.1M3.8 15.8l6.8-1M3.8 8.2 9 13"/></svg></div>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>解析</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>下载队列</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span>订阅</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7.5 7.5a6 6 0 0 0 0 9M16.5 7.5a6 6 0 0 1 0 9"/></svg><span>直播</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H4zM8 20h8M9 9h6M9 12h4"/></svg><span>屏幕翻译</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 15l4-4 4 4 3-3 5 5"/></svg><span>媒体库</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"/></svg><span>文件翻译</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v17l-5-4-5 4z"/></svg><span>生词与摘录</span></button>
<button class="nav-i" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v11H4zM9 8V5h6v3M4 13h16"/></svg><span>工具箱</span></button>
<div class="nav-gap"></div>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14M9 5v4M15 10v4M8 15v4"/></svg><span>设置</span></button>
</nav>
<main class="main">
<header class="topbar">
<h1>工具箱</h1>
<span class="spacer"></span><span class="chip ">主导航可收成图标条</span>
</header>
<div class="split" style="grid-template-columns:230px minmax(0,1fr) 320px"><aside class="cats sticky" aria-label="工具分组"><label class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-4-4"/></svg><input type="text" value="" placeholder="搜索工具…" aria-label="搜索工具"></label>
<div class="sec-t" style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:#6c8cff;box-shadow:none"></i>剪辑</div><button class="cat" aria-current="false"><span>剪辑（时间线）</span></button><button class="cat" aria-current="true"><span>快速处理</span></button><button class="cat" aria-current="false"><span>转 GIF</span></button><button class="cat" aria-current="false"><span>截图</span></button><div class="sec-t" style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:#ff9a5c;box-shadow:none"></i>压制与转换</div><button class="cat" aria-current="false"><span>压缩视频</span></button><button class="cat" aria-current="false"><span>转换格式</span></button><button class="cat" aria-current="false"><span>竖屏转横屏</span></button><div class="sec-t" style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:#b58cff;box-shadow:none"></i>画面与调色</div><button class="cat" aria-current="false"><span>视频规整</span></button><button class="cat" aria-current="false"><span>LUT 工作室</span></button><button class="cat" aria-current="false"><span>防抖</span></button><div class="sec-t" style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:#4be3d0;box-shadow:none"></i>声音</div><button class="cat" aria-current="false"><span>响度标准化</span></button><button class="cat" aria-current="false"><span>音效 / 混响</span></button><button class="cat" aria-current="false"><span>音频标签</span></button><div class="sec-t" style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:#ff7fbd;box-shadow:none"></i>字幕与 AI</div><button class="cat" aria-current="false"><span>字幕校对与调整</span></button><button class="cat" aria-current="false"><span>生成字幕</span></button><button class="cat" aria-current="false"><span>AI 纠错</span></button><button class="cat" aria-current="false"><span>摘要与章节</span></button></aside><section class="stack" style="display:flex;flex-direction:column;gap:18px"><section class="panel"><div class="panel-h"><h2>快速处理</h2><span class="eyebrow">裁剪 · 拼接 · 倍速 · 旋转 · 静音</span><span class="spacer"></span><button class="btn sm ghost" >返回上一页</button></div>
<div class="toolbar" style="margin-bottom:12px"><span class="seg" role="radiogroup" aria-label="工具"><label><input type="radio" name="g16" checked><span>裁剪</span></label><label><input type="radio" name="g16"><span>拼接</span></label><label><input type="radio" name="g16"><span>倍速</span></label><label><input type="radio" name="g16"><span>旋转</span></label><label><input type="radio" name="g16"><span>静音</span></label></span></div>
<div class="row"><div class="t"><b>入点 / 出点</b><small>拖动预览下方的滑块也可</small></div><div class="ctl"><label class="field" style="width:120px;flex:none"><input type="text" value="00:00:12.0" placeholder="" aria-label="入点"></label><label class="field" style="width:120px;flex:none"><input type="text" value="00:01:05.4" placeholder="" aria-label="出点"></label></div></div>
<div class="row"><div class="t"><b>保留方式</b></div><div class="ctl"><span class="seg" role="radiogroup" aria-label="保留方式"><label><input type="radio" name="g17" checked><span>快速（不重编码）</span></label><label><input type="radio" name="g17"><span>精确（重编码）</span></label></span></div></div>
<div class="row"><div class="t"><b>输出格式</b></div><div class="ctl"><select aria-label="格式" style="width:160px"><option selected>与原文件相同</option><option>MP4</option><option>MKV</option></select></div></div>
<div class="toolbar" style="margin-top:12px"><button class="btn primary" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>开始处理</button><button class="btn " ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>加入队列</button><span class="spacer"></span><span class="chip cyan">预览：实时</span></div></section>
<section class="panel"><div class="panel-h"><h2>任务</h2><span class="eyebrow">JobList</span></div><div class="list"><div class="item"><div class="grow"><div class="ttl">compress · 夜未央.mp4</div><div class="meta"><span>1080P → 720P</span></div><div style="margin-top:6px"><div class="prog amber"><i style="width:52%"></i></div></div></div><span class="chip amber">处理中</span></div><div class="item"><div class="grow"><div class="ttl">loudness · interview.wav</div><div class="meta"><span>−16 LUFS</span></div></div><span class="chip cyan">完成</span><button class="btn sm" >打开</button></div></div></section></section><aside class="stack sticky" style="display:flex;flex-direction:column;gap:18px"><section class="panel"><div class="panel-h"><h2>预览</h2><span class="spacer"></span><span class="seg" role="radiogroup" aria-label="预览档位"><label><input type="radio" name="g18" checked><span>实时</span></label><label><input type="radio" name="g18"><span>试一小段</span></label><label><input type="radio" name="g18"><span>不需要</span></label></span></div><div class="thumb t1"></div><p class="note" style="margin-top:10px">改参数立刻重画一帧。</p></section>
<section class="panel"><div class="panel-h"><h2>文件篮</h2><span class="eyebrow">3 个文件</span></div><div class="list"><div class="item"><div style="width:70px"><div class="thumb t1"></div></div><span class="grow ttl">夜未央.mp4</span><button class="btn sm ghost" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="item"><div style="width:70px"><div class="thumb t3"></div></div><span class="grow ttl">苏州河清晨.mp4</span><button class="btn sm ghost" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="empty" style="padding:14px">拖入更多文件</div></div></section></aside></div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"],"section":"外观"},"$preview":{"width":1360,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
