<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清影 · 小窗口与悬浮条</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="clearclip.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
body { margin: 0; }
.cc .plainmain { padding: 22px 28px 32px; display: flex; flex-direction: column; gap: 18px; min-height: 900px; }

</style>
</helmet>
<div class="cc" data-theme="{{theme}}">
<div class="plainmain">
<header class="topbar"><h1>小窗口与悬浮条</h1><span class="spacer"></span></header>
<div class="frames"><div class="frame-cap">迷你窗</div><div class="win" style="width:300px"><div class="win-h"><span class="logo-s">清</span><b>清影 · 迷你窗</b><span class="spacer"></span><button class="btn sm ghost" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="win-b"><label class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><input type="text" value="" placeholder="粘贴链接，Enter 解析" aria-label="链接"></label><div class="item"><div class="grow"><div class="ttl">【4K 延时】上海 · 夜未央</div><div class="prog "><i style="width:64%"></i></div></div></div><div class="toolbar"><button class="btn primary sm" >下载</button><button class="btn sm" >在清影里打开</button></div></div></div><div class="frame-cap">悬浮窗</div><div class="win" style="width:300px;border-radius:999px"><div class="win-b" style="flex-direction:row;align-items:center;padding:10px 16px;gap:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span class="grow note">拖入链接即下载</span><button class="btn sm" >译</button><button class="btn sm" >写</button></div></div><div class="frame-cap">截图翻译工具条</div><div class="win" style="width:420px"><div class="win-h"><span class="logo-s">清</span><b>截图翻译</b><span class="spacer"></span></div><div class="win-b" style="flex-direction:row;align-items:center;flex-wrap:wrap"><button class="btn sm" >重新框选</button><button class="btn sm" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 15l4-4 4 4 3-3 5 5"/></svg>复制译图</button><button class="btn sm" >钉在屏幕上</button><button class="btn sm" >保存</button><span class="spacer"></span><span class="kbd">Esc</span></div></div></div><div class="frames"><div class="frame-cap">钉住的译图</div><div class="win" style="width:260px"><div class="win-b" style="padding:10px"><div class="thumb t5" style="aspect-ratio:4/3"><div style="position:absolute;left:10%;top:30%;padding:3px 8px;border-radius:5px;background:rgba(6,10,18,.8);color:#fff;font-size:12px">接受任务 · 继续</div></div><div class="note">钉住的译图，右键关闭。</div></div></div><div class="frame-cap">直播字幕条</div><div class="win" style="width:420px"><div class="win-h"><span class="logo-s">清</span><b>直播字幕条</b><span class="spacer"></span><span class="chip acc"><i class="dot red"></i>录制中</span></div><div class="win-b"><div style="padding:8px 12px;border-radius:8px;background:rgba(6,10,18,.85);color:#fff;font-size:16px">欢迎来到今晚的直播间。<div style="font-size:12px;opacity:.7">Welcome to tonight's stream.</div></div></div></div><div class="frame-cap">选择录制画面</div><div class="win" style="width:420px"><div class="win-h"><span class="logo-s">清</span><b>选择要录制的画面</b><span class="spacer"></span></div><div class="win-b"><div class="g2"><div><div class="thumb t1"></div><div class="note" style="margin-top:6px">主屏幕</div></div><div><div class="thumb t3"></div><div class="note" style="margin-top:6px">PotPlayer</div></div></div><div class="toolbar"><button class="btn sm" >取消</button><button class="btn primary sm" >开始</button></div></div></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"],"section":"外观"},"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
