<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清影 · 直播</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="clearclip.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
body { margin: 0; }
.shell{min-height:860px}

</style>
</helmet>
<div class="cc" data-theme="{{theme}}">
<div class="shell">
<nav class="rail" aria-label="主导航">
<div class="logo" role="img" aria-label="清影"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3l3.5 6.1M20.2 8.2l-6.8 1M20.2 15.8 15 11M12 21l-3.5-6.1M3.8 15.8l6.8-1M3.8 8.2 9 13"/></svg></div>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>解析</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>下载队列</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span>订阅</span></button>
<button class="nav-i" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7.5 7.5a6 6 0 0 0 0 9M16.5 7.5a6 6 0 0 1 0 9"/></svg><span>直播</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H4zM8 20h8M9 9h6M9 12h4"/></svg><span>屏幕翻译</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 15l4-4 4 4 3-3 5 5"/></svg><span>媒体库</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"/></svg><span>文件翻译</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v17l-5-4-5 4z"/></svg><span>生词与摘录</span></button>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v11H4zM9 8V5h6v3M4 13h16"/></svg><span>工具箱</span></button>
<div class="nav-gap"></div>
<button class="nav-i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14M9 5v4M15 10v4M8 15v4"/></svg><span>设置</span></button>
</nav>
<main class="main">
<header class="topbar">
<h1>直播</h1>
<span class="spacer"></span><span class="chip amber"><i class="dot red"></i>2 路录制中</span>
</header>
<section class="panel"><div class="toolbar"><label class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><input type="text" value="" placeholder="粘贴直播间链接（B站、抖音、虎牙、斗鱼、YouTube、Twitch…）" aria-label="直播间链接"></label><button class="btn primary" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加直播间</button></div>
<p class="note" style="margin-top:10px">开播自动录制，下播自动结束。</p></section>
<div class="split r"><section class="panel"><div class="panel-h"><h2>直播间</h2><span class="eyebrow">4 个 · 录制中 2</span></div><div class="list">
<div class="item"><div style="width:120px;flex:none"><div class="thumb t1"></div></div><div class="grow"><div class="ttl">深夜电台 · 阿森</div><div class="meta"><span>B站</span><span class=mono>已录 01:12:40 · 1.4 GB</span></div></div><span class="chip amber"><i class="dot red"></i>录制中</span><label class="sw"><input type="checkbox" checked aria-label="自动录制"><span></span></label><button class="btn sm danger" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>停止</button></div><div class="item"><div style="width:120px;flex:none"><div class="thumb t2"></div></div><div class="grow"><div class="ttl">舞蹈练习室</div><div class="meta"><span>抖音</span><span class=mono>已录 00:21:05 · 380 MB</span></div></div><span class="chip amber"><i class="dot red"></i>录制中</span><label class="sw"><input type="checkbox" checked aria-label="自动录制"><span></span></label><button class="btn sm danger" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>停止</button></div><div class="item"><div style="width:120px;flex:none"><div class="thumb t5"></div></div><div class="grow"><div class="ttl">游戏频道 · Kay</div><div class="meta"><span>Twitch</span><span>未开播</span></div></div><span class="chip "><i class="dot "></i>未开播</span><label class="sw"><input type="checkbox" checked aria-label="自动录制"><span></span></label><button class="btn sm ghost" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button></div><div class="item"><div style="width:120px;flex:none"><div class="thumb t3"></div></div><div class="grow"><div class="ttl">天文台直播</div><div class="meta"><span>YouTube</span><span>未开播</span></div></div><span class="chip "><i class="dot "></i>未开播</span><label class="sw"><input type="checkbox" checked aria-label="自动录制"><span></span></label><button class="btn sm ghost" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button></div>
</div></section>
<aside class="stack sticky" style="display:flex;flex-direction:column;gap:18px"><section class="panel"><div class="panel-h"><h2>录制设置</h2></div>
<div class="row"><div class="t"><b>同时录制上限</b><small>超出的排队等待</small></div><div class="ctl"><span class="step"><button aria-label="减少">−</button><b>3</b><button aria-label="增加">+</button></span></div></div>
<div class="row"><div class="t"><b>自动删除</b><small>天前的录像（0 不删）</small></div><div class="ctl"><span class="step"><button aria-label="减少">−</button><b>30</b><button aria-label="增加">+</button></span></div></div>
<div class="row"><div class="t"><b>录制格式</b><small>断流时自动续录并分段</small></div><div class="ctl"><select aria-label="格式" style="width:90px"><option>MP4</option><option selected>MKV</option><option>TS</option></select></div></div>
<div class="row"><div class="t"><b>开播通知</b><small>录制开始时提醒</small></div><div class="ctl"><label class="sw"><input type="checkbox" checked aria-label="通知"><span></span></label></div></div>
<div class="row"><div class="t"><b>保存位置</b><small>D:\清影\直播录像</small></div></div></section>
<section class="panel"><div class="panel-h"><h2>磁盘</h2></div><div class="prog amber"><i style="width:38%"></i></div><p class="note" style="margin-top:8px">录像占用 128 GB，D 盘剩余 214 GB。空间不足时暂停录制并提示。</p></section></aside></div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"],"section":"外观"},"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
