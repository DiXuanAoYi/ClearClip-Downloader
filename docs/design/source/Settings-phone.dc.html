<button class="nav-i" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14M9 5v4M15 10v4M8 15v4"/></svg><span>设置</span></button>
</nav>
<main class="main">
<header class="topbar">
<h1>设置</h1>
<span class="spacer"></span><span class="chip cyan"><i class="dot "></i>已自动保存</span>
</header>
<div class="split">
<aside class="cats sticky" aria-label="设置分类">
<label class="field" style="margin-bottom:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-4-4"/></svg><input type="text" placeholder="搜索设置" aria-label="搜索设置"><span class="kbd">Ctrl K</span></label>
<button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>下载</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>解析</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v9a6 6 0 0 0 12 0V4h-4v9a2 2 0 0 1-4 0V4zM6 8h4M14 8h4"/></svg><span>BT 与 ed2k</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18M12 3a9 9 0 1 0 0 18"/></svg><span>网络</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0"/></svg><span>账号与 Cookie</span></button><button class="cat" aria-current="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1ZM11 18h2"/></svg><span>手机与浏览器扩展</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg><span>自动化</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg><span>AI</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/></svg><span>写作</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.500 3 8 7 10 4-2 7-5.500 7-10V6l-7-3Z"/></svg><span>安全与隐私</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 7.500v9L12 21l8-4.500v-9L12 3ZM4 7.500 12 12l8-4.500M12 12v9"/></svg><span>组件</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg><span>诊断</span></button><button class="cat" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14M9 5v4M15 10v4M8 15v4"/></svg><span>通用</span></button>
</aside>
<section aria-label="手机与浏览器扩展设置">
<div class="toolbar" style="margin-bottom:14px"><h2 style="font-size:18px">手机与浏览器扩展</h2><span class="spacer"></span><span class="eyebrow">设置页排布</span><span class="seg" role="radiogroup" aria-label="设置页排布"><label><input type="radio" name="g40" checked><span>自动平衡</span></label><label><input type="radio" name="g40"><span>按顺序</span></label><label><input type="radio" name="g40"><span>单列</span></label></span></div>

<div class="masonry" style="column-count:2">
<article class="panel "><div class="panel-h"><h2>手机互传</h2><span class="eyebrow">局域网</span><span class="spacer"></span></div><div class="row"><div class="t"><b>开启手机互传</b><small>同一 Wi-Fi 下扫码配对</small></div><div class="ctl"><label class="sw"><input type="checkbox" checked aria-label="互传"><span></span></label></div></div><div class="row"><div class="t"><b>配对验证码</b><small>6 位，每次配对重新生成</small></div><div class="ctl"><span class="chip cyan">482 913</span></div></div><div class="row"><div class="t"><b>新设备配对需要确认</b><small>电脑上点“允许”后才能互传</small></div><div class="ctl"><label class="sw"><input type="checkbox" checked aria-label="确认"><span></span></label></div></div><div class="row"><div class="t"><b>已配对设备</b><small>Pixel 8、iPad</small></div><div class="ctl"><button class="btn sm" >管理</button></div></div></article><article class="panel "><div class="panel-h"><h2>浏览器扩展</h2><span class="spacer"></span></div><div class="row"><div class="t"><b>扩展状态</b><small>Chrome 1.24.0 · 已连接</small></div><div class="ctl"><span class="chip cyan"><i class="dot "></i>已连接</span></div></div><div class="row"><div class="t"><b>用扩展下载时</b></div><div class="ctl"><span class="seg" role="radiogroup" aria-label="扩展"><label><input type="radio" name="g38" checked><span>加入队列</span></label><label><input type="radio" name="g38"><span>先预览</span></label></span></div></div><div class="row"><div class="t"><b>扩展悬浮窗</b><small>视频胶囊 + 划词翻译卡片</small></div><div class="ctl"><label class="sw"><input type="checkbox" checked aria-label="悬浮窗"><span></span></label></div></div><div class="row"><div class="t"><b>安装扩展</b><small>Chrome / Edge / Firefox</small></div><div class="ctl"><button class="btn sm" >打开安装页</button></div></div></article><article class="panel "><div class="panel-h"><h2>手机端</h2><span class="spacer"></span></div><div class="row"><div class="t"><b>手机网页主题</b></div><div class="ctl"><span class="seg" role="radiogroup" aria-label="主题"><label><input type="radio" name="g39" checked><span>跟随系统</span></label><label><input type="radio" name="g39"><span>深色</span></label><label><input type="radio" name="g39"><span>浅色</span></label></span></div></div><div class="row"><div class="t"><b>接收文件保存到</b></div><div class="ctl"><label class="field" style="width:180px;flex:none"><input type="text" value="D:\清影下载\手机" placeholder="" aria-label="位置"></label></div></div><div class="row"><div class="t"><b>缩略图</b><small>在列表里显示预览</small></div><div class="ctl"><label class="sw"><input type="checkbox" checked aria-label="缩略图"><span></span></label></div></div></article>
</div>
<div class="toolbar"><span class="mono" style="color:var(--faint);font-size:12px">修改即时生效，无需手动保存</span><span class="spacer"></span><button class="btn sm" >恢复默认</button></div>
</section>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"],"section":"外观"},"$preview":{"width":1360,"height":900}}'>

  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
